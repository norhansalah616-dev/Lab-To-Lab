<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Lab to Lab Manifest Generator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; margin: 0 !important; }
      .lab-page {
        page-break-after: always;
        break-after: page;
        margin: 0 !important;
        padding: 15mm 10mm !important;
        box-shadow: none !important;
        border: none !important;
        width: 100% !important;
      }
      table { border-collapse: collapse !important; width: 100% !important; font-size: 11pt !important; }
      th, td { border: 1px solid #000 !important; padding: 5px 8px !important; }
    }
    .form-table th, .form-table td { border: 1px solid #475569; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8 font-sans">

  <div class="max-w-5xl mx-auto space-y-6">

    <!-- كارت التحكم وإدخال البيانات (يختفي عند الطباعة) -->
    <div class="bg-white rounded-xl shadow-md border border-slate-200 p-6 no-print space-y-5">
      <div class="border-b pb-4 flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">نظام استخراج نماذج Lab to Lab</h1>
          <p class="text-xs text-slate-500 mt-1">مطابق للنموذج المعتمد: AMS.EG.LAB.004.F.1 V1</p>
        </div>
        <button id="printBtn" onclick="window.print()" disabled class="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white font-bold py-2.5 px-6 rounded-lg shadow transition flex items-center gap-2">
          <span>🖨️</span> طباعة / حفظ كـ PDF
        </button>
      </div>

      <!-- إعدادات النموذج الثابتة -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">اسم المسلم:</label>
          <input type="text" id="senderName" value="اندلسيه الشلالات(نورهان صلاح )" class="w-full text-sm border border-slate-300 rounded px-3 py-2 bg-slate-50">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">اسم المسئول عن توصيل العينات:</label>
          <input type="text" id="courierName" placeholder="ا/ اسم المندوب" class="w-full text-sm border border-slate-300 rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">تاريخ ووقت الخروج:</label>
          <input type="text" id="dispatchDateTime" class="w-full text-sm border border-slate-300 rounded px-3 py-2">
        </div>
      </div>

      <!-- رفع الملف -->
      <div>
        <label class="cursor-pointer flex flex-col items-center justify-center border-2 border-dashed border-blue-400 bg-blue-50/50 hover:bg-blue-50 py-6 rounded-xl transition">
          <span class="text-3xl mb-1">📊</span>
          <span class="text-sm font-bold text-blue-700">اضغط لاختيار شيت الإكسيل (Excel Sheet)</span>
          <span class="text-xs text-slate-400 mt-1">يدعم ملفات .xlsx و .xls</span>
          <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden">
        </label>
      </div>

      <!-- شريط الإحصائيات -->
      <div id="statsSummary" class="hidden text-xs bg-slate-50 border p-3 rounded-lg flex justify-around font-medium text-slate-700">
        <div>إجمالي السجلات بالشيت: <span id="totalCount" class="font-bold text-slate-900">0</span></div>
        <div>المحولة خارجياً: <span id="transferredCount" class="font-bold text-emerald-600">0</span></div>
        <div>المعامل المحول إليها: <span id="labsCount" class="font-bold text-blue-600">0</span></div>
        <div>مستبعد (يوجد ملاحظة technical): <span id="skippedCount" class="font-bold text-amber-600">0</span></div>
      </div>
    </div>

    <!-- مكان عرض الكشوفات أو التنبيه -->
    <div id="formsContainer" class="space-y-8"></div>

  </div>

  <script>
    // 1. خريطة التحاليل والمعامل
    const RAW_TEST_MAPPING = {
      // معمل دكتور صلاح مرزوق
      'igm immunoglobulin': 'معمل دكتور صلاح مرزوق',
      'serum ig g': 'معمل دكتور صلاح مرزوق',
      'serum igg': 'معمل دكتور صلاح مرزوق',
      'ace (angiotensin converting enzyme)': 'معمل دكتور صلاح مرزوق',
      'a.m.a': 'معمل دكتور صلاح مرزوق',
      'homocystien': 'معمل دكتور صلاح مرزوق',
      'homocysteine': 'معمل دكتور صلاح مرزوق',
      'h. pylori iga in serum': 'معمل دكتور صلاح مرزوق',
      'antithrombin iii': 'معمل دكتور صلاح مرزوق',
      'protein c': 'معمل دكتور صلاح مرزوق',
      'protein s': 'معمل دكتور صلاح مرزوق',
      'lupus anticoagulant': 'معمل دكتور صلاح مرزوق',
      'anti - cardiolipin igm': 'معمل دكتور صلاح مرزوق',
      'anti - cardiolipin igg': 'معمل دكتور صلاح مرزوق',
      'lipoprotein (a)': 'معمل دكتور صلاح مرزوق',
      'a.sm.a': 'معمل دكتور صلاح مرزوق',
      'sla ab (soluble liver ag auto ab)': 'معمل دكتور صلاح مرزوق',
      'ebv ab igm': 'معمل دكتور صلاح مرزوق',
      'aldosterone renin ratio': 'معمل دكتور صلاح مرزوق',
      'fibrinogen level': 'معمل دكتور صلاح مرزوق',
      'anti dgp igg': 'معمل دكتور صلاح مرزوق',
      'anti dgp iga': 'معمل دكتور صلاح مرزوق',

      // معمل المبره
      'immunofixation': 'معمل المبره',
      'protein electrophoresis': 'معمل المبره',
      'p c r for tb': 'معمل المبره',

      // معمل الانصارى
      'vitamin a': 'معمل الانصارى',
      'vitamin e': 'معمل الانصارى',
      'serum selenium': 'معمل الانصارى',
      'serum mercury': 'معمل الانصارى',
      'serum lead': 'معمل الانصارى',
      'vitamin b6': 'معمل الانصارى',
      'vitamin b2': 'معمل الانصارى',

      // معمل سموحة
      'c.e.a.': 'معمل سموحة',
      'ca 15.3': 'معمل سموحة',
      'ca 15-3': 'معمل سموحة',
      'alpha-fetoprotein(afp)': 'معمل سموحة',
      'a ds d n a': 'معمل سموحة',

      // معمل انطونيادس
      'l h (luteinising hormone)': 'معمل انطونيادس',
      'f s h (follicle stimulating hormone)': 'معمل انطونيادس',
      'l h': 'معمل انطونيادس',
      'lh': 'معمل انطونيادس',
      'f s h': 'معمل انطونيادس',
      'fsh': 'معمل انطونيادس',

      // معمل ياسر الدويك
      'small biopsy': 'معمل ياسر الدويك',
      'cytology (pleural fluid)': 'معمل ياسر الدويك',
      'whole organ': 'معمل ياسر الدويك',
      'medium sized boipsy': 'معمل ياسر الدويك',
      'medium sized biopsy': 'معمل ياسر الدويك',
      'immunohistochemistry': 'معمل ياسر الدويك',
      'immunohistochemistry for cd 30': 'معمل ياسر الدويك',
      'bcl2': 'معمل ياسر الدويك',
      'immunohistochemistry for cd 10': 'معمل ياسر الدويك'
    };

    // دالة لتنظيف النص تماماً من أي مسافات، نقاط، أو رموز لضمان التطابق
    function normalize(str) {
      return String(str || '')
        .replace(/\u00a0/g, ' ') // إزالة المسافات الخفية
        .toLowerCase()
        .replace(/[^a-z0-9\u0600-\u06ff]/gi, '') // إبقاء الحروف والأرقام فقط
        .trim();
    }

    // بناء خريطة معالجة مسبقة للمطابقة الفورية
    const NORMALIZED_MAPPING = {};
    for (let [k, lab] of Object.entries(RAW_TEST_MAPPING)) {
      NORMALIZED_MAPPING[normalize(k)] = lab;
    }

    // إعداد التاريخ والوقت
    const now = new Date();
    document.getElementById('dispatchDateTime').value = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

    const fileInput = document.getElementById('excelFile');
    const printBtn = document.getElementById('printBtn');
    const formsContainer = document.getElementById('formsContainer');
    const statsSummary = document.getElementById('statsSummary');

    fileInput.addEventListener('change', handleFileUpload);

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];

        // 1. قراءة الملف كمصفوفة صفوف للبحث التلقائي عن السطر الحقيقي للترويسة
        const rawRows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
        
        let headerRowIndex = 0;
        for (let i = 0; i < Math.min(rawRows.length, 15); i++) {
          const rowText = rawRows[i].map(c => normalize(c)).join(' ');
          // البحث عن كلمات دالة تدل على بداية الجدول
          if (rowText.includes('product') || rowText.includes('patient') || rowText.includes('mrn') || rowText.includes('barcode') || rowText.includes('test')) {
            headerRowIndex = i;
            break;
          }
        }

        // 2. تحويل البيانات لكائنات بالاعتماد على سطر الترويسة المكتشف
        const rows = XLSX.utils.sheet_to_json(firstSheet, { range: headerRowIndex, defval: '' });

        processAndRender(rows);
      };
      reader.readAsArrayBuffer(file);
    }

    // دالة مرنة للغاية للبحث عن قيمة العمود حتى لو اختلف اسمه قليلاً
    function getVal(row, possibleKeys) {
      for (let k of Object.keys(row)) {
        const cleanK = normalize(k);
        for (let target of possibleKeys) {
          if (cleanK.includes(normalize(target))) {
            return String(row[k] || '').trim();
          }
        }
      }
      return '';
    }

    function processAndRender(rows) {
      formsContainer.innerHTML = '';
      
      const groupedByLab = {};
      let transferredCount = 0;
      let skippedCount = 0;
      const sampleDetectedTests = [];

      rows.forEach(row => {
        // قراءة اسم التحليل من عمود Product أو Test
        const rawProduct = getVal(row, ['product', 'test', 'item', 'service', 'اسم التحليل']);
        if (rawProduct && sampleDetectedTests.length < 5) {
          sampleDetectedTests.push(rawProduct);
        }

        // قراءة خانة الملاحظات الفنية Technical
        const technicalNotes = getVal(row, ['technical', 'technician', 'tech note']);

        // التحقق من المعمل باستخدام الفحص الذكي
        const normProduct = normalize(rawProduct);
        let targetLab = NORMALIZED_MAPPING[normProduct];

        // في حال كان اسم التحليل بالشيت يحتوي تفاصيل زيادة
        if (!targetLab && normProduct.length > 3) {
          for (let [key, lab] of Object.entries(NORMALIZED_MAPPING)) {
            if (normProduct.includes(key) || key.includes(normProduct)) {
              targetLab = lab;
              break;
            }
          }
        }

        if (targetLab) {
          // التحقق من أن خانة technical خالية تماماً
          if (technicalNotes === '') {
            if (!groupedByLab[targetLab]) {
              groupedByLab[targetLab] = [];
            }

            groupedByLab[targetLab].push({
              name: getVal(row, ['patient name', 'name', 'اسم المريض']),
              age: getVal(row, ['age', 'السن', 'العمر']),
              id: getVal(row, ['mrn', 'id', 'patient id', 'barcode', 'الرقم الطبي', 'الباركود']),
              test: rawProduct.toUpperCase(),
              note: getVal(row, ['note', 'notes', 'ملاحظات'])
            });
            transferredCount++;
          } else {
            skippedCount++;
          }
        }
      });

      const labNames = Object.keys(groupedByLab);

      // في حال عدم العثور على نتائج
      if (labNames.length === 0) {
        printBtn.disabled = true;
        statsSummary.classList.add('hidden');
        
        // جلب أسماء الأعمدة لتسهيل فحص الشيت
        const detectedColumns = rows.length > 0 ? Object.keys(rows[0]).join(' | ') : 'لم يتم العثور على أعمدة';

        formsContainer.innerHTML = `
          <div class="bg-amber-50 border border-amber-300 text-amber-900 p-6 rounded-xl shadow-sm space-y-3">
            <div class="flex items-center gap-3">
              <span class="text-3xl">📋</span>
              <p class="text-xl font-bold">لا يوجد Lab To Lab</p>
            </div>
            <p class="text-xs text-amber-700">لم يطابق أي سجل شروط الخروج لمعمل خارجي مع فراغ خانة technical.</p>
            
            <!-- صندوق الفحص التقني التلقائي للشيت -->
            <div class="bg-white/80 p-3 rounded-lg border border-amber-200 text-right text-xs font-mono space-y-1 text-slate-700">
              <p class="font-bold text-slate-900">🔍 تقرير فحص الشيت التلقائي:</p>
              <p>• إجمالي الصفوف المفحوصة: ${rows.length}</p>
              <p>• أسماء الأعمدة المكتشفة: <span class="text-blue-700 font-bold">${detectedColumns || 'فارغة'}</span></p>
              <p>• عينة من أسماء التحاليل المقروءة: <span class="text-emerald-700 font-bold">${sampleDetectedTests.join(' , ') || 'لم تُقرأ أي تحاليل'}</span></p>
            </div>
          </div>
        `;
        return;
      }

      // إظهار الإحصائيات
      statsSummary.classList.remove('hidden');
      document.getElementById('totalCount').innerText = rows.length;
      document.getElementById('transferredCount').innerText = transferredCount;
      document.getElementById('labsCount').innerText = labNames.length;
      document.getElementById('skippedCount').innerText = skippedCount;
      printBtn.disabled = false;

      // إنشاء صفحة لكل معمل
      labNames.forEach(lab => {
        const labRecords = groupedByLab[lab];
        const pageElem = createLabFormPage(lab, labRecords);
        formsContainer.appendChild(pageElem);
      });
    }

    function createLabFormPage(labName, records) {
      const page = document.createElement('div');
      page.className = 'lab-page bg-white p-6 rounded-xl shadow-md border border-slate-200';

      const sender = document.getElementById('senderName').value;
      const courier = document.getElementById('courierName').value || 'ا/ ............................';
      const dispatchTime = document.getElementById('dispatchDateTime').value;

      // تجميع تحاليل المريض الواحد تحت بعضها
      const groupedPatients = [];
      const patientMap = {};

      records.forEach(rec => {
        const key = (rec.id + '_' + rec.name).toLowerCase();
        if (!patientMap[key]) {
          patientMap[key] = {
            name: rec.name,
            age: rec.age,
            id: rec.id,
            tests: []
          };
          groupedPatients.push(patientMap[key]);
        }
        patientMap[key].tests.push({ test: rec.test, note: rec.note });
      });

      let rowsHtml = '';
      let indexCounter = 1;

      groupedPatients.forEach(patient => {
        patient.tests.forEach((t, tIndex) => {
          if (tIndex === 0) {
            rowsHtml += `
              <tr class="text-xs">
                <td class="text-center font-bold">${indexCounter++}</td>
                <td class="font-semibold text-slate-900">${patient.name}</td>
                <td class="text-center">${patient.age}</td>
                <td class="text-center font-mono font-bold">${patient.id}</td>
                <td class="font-semibold text-blue-900">${t.test}</td>
                <td class="text-center text-slate-500">${t.note || ''}</td>
              </tr>
            `;
          } else {
            rowsHtml += `
              <tr class="text-xs">
                <td class="text-center"></td>
                <td></td>
                <td></td>
                <td></td>
                <td class="font-semibold text-blue-900">${t.test}</td>
                <td class="text-center text-slate-500">${t.note || ''}</td>
              </tr>
            `;
          }
        });
      });

      // إضافة أسطر فارغة إضافية للحالات المكتوبة يدوياً
      for (let i = 0; i < 3; i++) {
        rowsHtml += `
          <tr class="h-6">
            <td></td><td></td><td></td><td></td><td></td><td></td>
          </tr>
        `;
      }

      page.innerHTML = `
        <div class="mb-4">
          <div class="flex justify-between items-center border-b pb-2 mb-2">
            <h2 class="text-lg font-bold text-slate-800">Lab to lab form</h2>
            <span class="text-xs font-mono text-slate-500">AMS.EG.LAB.004.F.1 V1</span>
          </div>

          <table class="form-table w-full text-xs text-right mb-4">
            <tr>
              <td class="bg-slate-50 font-bold w-1/4 p-1.5">اسم المعمل المرسل اليه</td>
              <td class="font-bold text-blue-800 w-1/4 p-1.5">${labName}</td>
              <td class="bg-slate-50 font-bold w-1/4 p-1.5">تاريخ ووقت خروج العينات</td>
              <td class="w-1/4 p-1.5 font-mono">${dispatchTime}</td>
            </tr>
            <tr>
              <td class="bg-slate-50 font-bold p-1.5">اسم المسلم</td>
              <td class="p-1.5">${sender}</td>
              <td class="bg-slate-50 font-bold p-1.5">وقت وصول العينات</td>
              <td class="p-1.5">................................</td>
            </tr>
            <tr>
              <td class="bg-slate-50 font-bold p-1.5">المستلم</td>
              <td class="p-1.5">................................</td>
              <td class="bg-slate-50 font-bold p-1.5">اسم المسئول عن توصيل العينات</td>
              <td class="p-1.5">${courier}</td>
            </tr>
            <tr>
              <td class="bg-slate-50 font-bold p-1.5">درجه الحراره عند الخروج من المعمل</td>
              <td class="font-bold text-emerald-700 p-1.5">4 C</td>
              <td class="bg-slate-50 font-bold p-1.5">درجه الحراره عند الوصول الى المعمل الخارجى</td>
              <td class="p-1.5">................................</td>
            </tr>
          </table>
        </div>

        <table class="form-table w-full text-right">
          <thead>
            <tr class="bg-slate-100 text-xs font-bold text-slate-800">
              <th class="p-1.5 text-center w-8">#</th>
              <th class="p-1.5 w-1/3">name</th>
              <th class="p-1.5 text-center w-16">age</th>
              <th class="p-1.5 text-center w-28">ID</th>
              <th class="p-1.5">test</th>
              <th class="p-1.5 w-24">note</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>
      `;

      return page;
    }
  </script>
</body>
</html>
