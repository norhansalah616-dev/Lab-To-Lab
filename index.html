<!DOCTYPE html>

    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    input, button {
      -webkit-user-select: auto;
      user-select: auto;
    }

    @media print {
      @page {
        margin: 8mm;
      }
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; margin: 0 !important; }
      .lab-page {
        page-break-after: always;
        break-after: page;
        margin: 0 !important;
        padding: 8mm !important;
        box-shadow: none !important;
        border: none !important;
        width: 100% !important;
      }
      table { border-collapse: collapse !important; width: 100% !important; }
      th, td { border: 1.2px solid #000 !important; padding: 4px 6px !important; }
    }
    .form-table th, .form-table td { border: 1.2px solid #334155; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 p-4 md:p-8 font-sans" oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

        </div>
        <button id="printBtn" onclick="window.print()" disabled class="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white font-bold py-2.5 px-6 rounded-lg shadow transition flex items-center gap-2">
          <span>🖨️</span> طباعة / حفظ كـ PDF
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">اسم المسلم:</label>
          <input type="text" id="senderName" value="اندلسيه الشلالات(نورهان صلاح )" class="w-full border rounded p-2 bg-slate-50">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">مسئول توصيل العينات:</label>
          <input type="text" id="courierName" value="ا/ سعيد رجب" class="w-full border rounded p-2">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">تاريخ ووقت خروج العينات:</label>
          <input type="text" id="dispatchDateTime" class="w-full border rounded p-2 font-mono">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">حرارة الخروج / الوصول:</label>
          <div class="flex gap-1">
            <input type="text" id="tempOut" value="3.0" title="عند الخروج" class="w-1/2 border rounded p-2 text-center font-bold">
            <input type="text" id="tempIn" value="4.0" title="عند الوصول" class="w-1/2 border rounded p-2 text-center font-bold">
          </div>
        </div>
      </div>

      <!-- منطقة رفع الملف -->
      <div>
        <label class="cursor-pointer flex flex-col items-center justify-center border-2 border-dashed border-amber-400 bg-amber-50/40 hover:bg-amber-50 py-5 rounded-xl transition">
          <span class="text-3xl mb-1">📊</span>
          <span class="text-sm font-bold text-amber-800">اضغط لاختيار شيت الإكسيل (Excel Sheet)</span>
          <span class="text-xs text-slate-400 mt-1">تصفية ذكية مع استبعاد التحاليل الروتينية والداخلية تلقائياً</span>
          <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden">
        </label>
      </div>

    function cleanStr(str) {
      return String(str || '')
        .replace(/\u00a0/g, ' ')
        .toLowerCase()
        .replace(/[^a-z0-9\u0600-\u06ff]/gi, '')
        .trim();
    }

    const NORMALIZED_MAPPING = {};
    for (let [k, lab] of Object.entries(RAW_TEST_MAPPING)) {
      NORMALIZED_MAPPING[cleanStr(k)] = lab;
    }

    const NORMALIZED_EXCLUDES = new Set(INTERNAL_EXCLUDES.map(cleanStr));

    // التاريخ التلقائي لليوم
    const now = new Date();
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();
    document.getElementById('dispatchDateTime').value = `${day}-${month}-${year}`;

    const fileInput = document.getElementById('excelFile');
    const printBtn = document.getElementById('printBtn');
    const formsContainer = document.getElementById('formsContainer');
    const statsSummary = document.getElementById('statsSummary');

    fileInput.addEventListener('change', handleFileUpload);

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];

        const grid = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
        processMatrixData(grid);
      };
      reader.readAsArrayBuffer(file);
    }

    function processMatrixData(grid) {
      formsContainer.innerHTML = '';
      if (!grid || grid.length === 0) return;

      let headerRowIndex = -1;
      let colMap = { code: 0, name: 2, product: 4, techNotes: 7 };

      for (let r = 0; r < Math.min(grid.length, 15); r++) {
        const row = grid[r];
        if (!Array.isArray(row)) continue;

        let foundProduct = false;
        let foundCode = false;

        row.forEach((cell, idx) => {
          const val = cleanStr(cell);
          if (val === 'product') { colMap.product = idx; foundProduct = true; }
          if (val === 'code') { colMap.code = idx; foundCode = true; }
          if (val === 'name') { colMap.name = idx; }
          if (val === 'technotes' || val === 'technical') { colMap.techNotes = idx; }
        });

        if (foundProduct || foundCode) {
          headerRowIndex = r;
          break;
        }
      }

      const startRow = headerRowIndex !== -1 ? headerRowIndex + 1 : 4;

      const groupedByLab = {};
      let transferredCount = 0;
      let skippedCount = 0;
      let scannedTotal = 0;

      let currentPatientCode = '';
      let currentPatientName = '';

      for (let r = startRow; r < grid.length; r++) {
        const row = grid[r];
        if (!row || row.length === 0) continue;

        const rowCode = String(row[colMap.code] || '').trim();
        const rowName = String(row[colMap.name] || '').trim();
        const rawProduct = String(row[colMap.product] || '').trim();
        const rawTechNotes = String(row[colMap.techNotes] || '').trim();

        if (rowCode !== '') currentPatientCode = rowCode;
        if (rowName !== '') currentPatientName = rowName;

        if (rawProduct === '') continue;
        scannedTotal++;

        const normProduct = cleanStr(rawProduct);

        if (NORMALIZED_EXCLUDES.has(normProduct)) {
          continue;
        }

        const targetLab = NORMALIZED_MAPPING[normProduct];

        if (targetLab) {
          if (rawTechNotes === '') {
            if (!groupedByLab[targetLab]) groupedByLab[targetLab] = [];

            groupedByLab[targetLab].push({
              name: currentPatientName,
              id: currentPatientCode,
              age: '',
              test: rawProduct,
              note: ''
            });
            transferredCount++;
          } else {
            skippedCount++;
          }
        }
      }

      const labNames = Object.keys(groupedByLab);

      if (labNames.length === 0) {
        printBtn.disabled = true;
        statsSummary.classList.add('hidden');
        formsContainer.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 text-amber-800 text-center p-8 rounded-xl shadow-sm">
            <span class="text-4xl block mb-2">📋</span>
            <p class="text-xl font-bold">لا يوجد Lab To Lab</p>
            <p class="text-xs text-amber-600 mt-1">لم يتم العثور على أي تحاليل مطابقة لقائمة المعامل الخارجية أو أن جميع العينات بها ملاحظات فنية.</p>
          </div>
        `;
        return;
      }

      statsSummary.classList.remove('hidden');
      document.getElementById('totalCount').innerText = scannedTotal;
      document.getElementById('transferredCount').innerText = transferredCount;
      document.getElementById('labsCount').innerText = labNames.length;
      document.getElementById('skippedCount').innerText = skippedCount;
      printBtn.disabled = false;

      labNames.forEach(lab => {
        const records = groupedByLab[lab];
        const page = renderOfficialLabForm(lab, records);
        formsContainer.appendChild(page);
      });
    }

    function renderOfficialLabForm(labName, records) {
      const page = document.createElement('div');
      page.className = 'lab-page bg-white p-8 rounded-xl shadow border border-slate-200';

      const sender = document.getElementById('senderName').value;
      const courier = document.getElementById('courierName').value;
      const dispatchDate = document.getElementById('dispatchDateTime').value;
      const tempOut = document.getElementById('tempOut').value;
      const tempIn = document.getElementById('tempIn').value;

      const groupedPatients = [];
      const patientMap = {};

      records.forEach(rec => {
        const key = (rec.id || rec.name).toLowerCase();
        if (!patientMap[key]) {
          patientMap[key] = {
            name: rec.name,
            age: rec.age,
            id: rec.id,
            tests: []
          };
          groupedPatients.push(patientMap[key]);
        }
        patientMap[key].tests.push({ test: rec.test, note: rec.note });
      });

      let rowsHtml = '';
      let indexCounter = 1;

      groupedPatients.forEach(patient => {
        patient.tests.forEach((t, tIdx) => {
          if (tIdx === 0) {
            rowsHtml += `
              <tr class="text-xs text-slate-900">
                <td class="text-center font-bold p-1">${indexCounter++}</td>
                <td class="font-bold text-right p-1.5">${patient.name}</td>
                <td class="text-center font-semibold p-1">${patient.age}</td>
                <td class="text-center font-mono font-bold p-1">${patient.id}</td>
                <td class="font-bold text-left px-2 py-1">${t.test}</td>
                <td class="text-center p-1 text-slate-600">${t.note || ''}</td>
              </tr>
            `;
          } else {
            rowsHtml += `
              <tr class="text-xs text-slate-900">
                <td class="text-center p-1"></td>
                <td class="p-1.5"></td>
                <td class="p-1"></td>
                <td class="p-1"></td>
                <td class="font-bold text-left px-2 py-1">${t.test}</td>
                <td class="text-center p-1 text-slate-600">${t.note || ''}</td>
              </tr>
            `;
          }
        });
      });

      for (let i = 0; i < 4; i++) {
        rowsHtml += `
          <tr class="h-6">
            <td class="p-1"></td><td class="p-1"></td><td class="p-1"></td><td class="p-1"></td><td class="p-1"></td><td class="p-1"></td>
          </tr>
        `;
      }

      page.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center pb-2 border-b border-slate-100">
            <!-- الشعار الذهبي الرسمي (Andalusia Health) -->
            <div class="flex items-center gap-3">
              <svg class="w-12 h-12 flex-shrink-0" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M48.5 48 L51.5 48 L52.5 86 L47.5 86 Z" fill="#C59B27"/>
                <path d="M45 86 C45 86 48 88 50 88 C52 88 55 86 55 86 L53.5 85 L46.5 85 Z" fill="#B3861B"/>
                <path d="M50 16 C48.5 26 48.5 38 50 48 C51.5 38 51.5 26 50 16 Z" fill="#E0B644"/>
                <path d="M50.5 44 C58 30 71 24 84 28 C73 36 62 41 51.5 47 Z" fill="#D4A732"/>
                <path d="M51 49 C63 40 78 40 88 48 C76 54 63 53 51.5 51 Z" fill="#C59B27"/>
                <path d="M51 53 C61 49 76 56 82 67 C72 67 61 62 51 56 Z" fill="#A87B14"/>
                <path d="M49.5 44 C42 30 29 24 16 28 C27 36 38 41 48.5 47 Z" fill="#D4A732"/>
                <path d="M49 49 C37 40 22 40 12 48 C24 54 37 53 48.5 51 Z" fill="#C59B27"/>
                <path d="M49 53 C39 49 24 56 18 67 C28 67 39 62 49 56 Z" fill="#A87B14"/>
              </svg>
              <div class="text-right flex flex-col justify-center">
                <span class="text-base font-extrabold tracking-tight text-[#C59B27] font-serif leading-tight">أندلسية صحة</span>
                <span class="text-[11px] font-bold tracking-widest text-[#B3861B] uppercase font-sans">ANDALUSIA HEALTH</span>
                <span class="text-[9px] font-semibold text-slate-500 tracking-tight">AL SHALALAT • مستشفى الشلالات</span>
              </div>
            </div>

            <h2 class="text-base font-bold text-slate-800 text-center flex-1 pr-6">Lab to lab form</h2>
            <!-- مساحة فارغة بدلاً من كود النموذج للحفاظ على توسيط العنوان بدقة -->
            <div class="w-24"></div>
          </div>

          <table class="form-table w-full text-xs text-right mb-4">
            <tr>
              <td class="bg-slate-100 font-bold w-[22%] p-1.5">اسم المعمل المرسل اليه</td>
              <td class="font-bold text-blue-900 w-[28%] p-1.5 text-center text-sm">${labName}</td>
              <td class="bg-slate-100 font-bold w-[25%] p-1.5">تاريخ ووقت خروج العينات</td>
              <td class="w-[25%] p-1.5 text-center font-mono font-bold">${dispatchDate}</td>
            </tr>
            <tr>
              <td class="bg-slate-100 font-bold p-1.5">اسم المسلم</td>
              <td class="p-1.5 text-center font-medium">${sender}</td>
              <td class="bg-slate-100 font-bold p-1.5">وقت وصول العينات</td>
              <td class="p-1.5 text-center text-slate-400">..............................</td>
            </tr>
            <tr>
              <td class="bg-slate-100 font-bold p-1.5">المستلم</td>
              <td class="p-1.5 text-center text-slate-400">..............................</td>
              <td class="bg-slate-100 font-bold p-1.5">اسم المسئول عن توصيل العينات</td>
              <td class="p-1.5 text-center font-bold">${courier}</td>
            </tr>
            <tr>
              <td class="bg-slate-100 font-bold p-1.5">درجه الحراره عند الخروج من المعمل</td>
              <td class="p-1.5 text-center font-bold text-emerald-800">${tempOut} °C</td>
              <td class="bg-slate-100 font-bold p-1.5">درجه الحراره عند الوصول الى المعمل الخارجى</td>
              <td class="p-1.5 text-center font-bold text-slate-700">${tempIn} °C</td>
            </tr>
          </table>

          <table class="form-table w-full text-right">
            <thead>
              <tr class="bg-slate-100 text-xs font-bold text-slate-900">
                <th class="p-1 text-center w-8">#</th>
                <th class="p-1.5 w-1/3 text-center">name</th>
                <th class="p-1 text-center w-14">age</th>
                <th class="p-1 text-center w-28">ID</th>
                <th class="p-1 text-center">test</th>
                <th class="p-1 text-center w-20">note</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>

          <!-- تذييل الصفحة مع حقوق الملكية الفكرية -->
          <div class="pt-6 flex justify-between items-center text-[10px] text-slate-500 font-sans border-t border-slate-100 mt-4">
            <div>© Developed by Nourhan Salah</div>
            <div class="font-mono">Page 1 of 1</div>
            <div>جميع الحقوق محفوظة © نورهان صلاح</div>
          </div>
        </div>
      `;

      return page;
    }
  </script>
